# docker-compose.dev.yml
services:
  postgres:
    image: postgres:16-alpine
    container_name: stba_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: db_akretech
      POSTGRES_USER: akreuser
      POSTGRES_PASSWORD: Suksesai2026!
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stba_redis
    restart: always
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: stba_pgadmin
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@stba.ac.id
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - postgres

  minio:
    image: minio/minio
    container_name: stba_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
