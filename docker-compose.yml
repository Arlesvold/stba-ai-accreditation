version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stba_backend
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://akreuser:Suksesai2026!@postgres:5432/db_akretech
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stba_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: stba_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: db_akretech
      POSTGRES_USER: akreuser
      POSTGRES_PASSWORD: Suksesai2026!
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stba_redis
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: stba_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
