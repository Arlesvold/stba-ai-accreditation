version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stba_backend
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=mysql://akreuser:Suksesai2026!@mysql:3306/db_akretech
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stba_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: stba_mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: db_akretech
      MYSQL_USER: akreuser
      MYSQL_PASSWORD: Suksesai2026!
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: stba_redis
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: stba_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  minio_data:
